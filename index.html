<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEDRA v6</title>

<style>

/* =============================
   GLOBAL STYLE
============================= */
*{
  box-sizing:border-box;
  font-family:system-ui, Tahoma;
}

body{
  margin:0;
  background:#0A2A66;
  color:#fff;
}

/* =============================
   SPLASH SCREEN
============================= */
#splash{
  position:fixed;
  inset:0;
  background:#0A2A66;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.logoSpin{
  font-size:70px;
  font-weight:900;
  letter-spacing:3px;
  animation:spinLogo 2s linear infinite;
}

@keyframes spinLogo{
  from{transform:rotateY(0deg)}
  to{transform:rotateY(360deg)}
}

/* =============================
   HEADER
============================= */
.header{
  padding:15px 20px;
  background:#071f4d;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 10px rgba(0,0,0,.4);
}

.header h1{
  margin:0;
  font-size:20px;
}

.dateInfo{
  font-size:14px;
  font-weight:bold;
  color:#fff;
}

/* =============================
   MAIN PAGE
============================= */
.main{
  min-height:100vh;
  padding:20px;
  background:#0A2A66;
}

/* =============================
   BUTTONS 3D
============================= */
.btn{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
  box-shadow:0 6px 0 rgba(0,0,0,.4);
}

.btn:hover{
  transform:translateY(-2px);
}

.btn:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 rgba(0,0,0,.4);
}

.btn-primary{
  background:#1e40af;
  color:#fff;
}

.btn-danger{
  background:#b91c1c;
  color:#fff;
}

.btn-green{
  background:#15803d;
  color:#fff;
}

/* =============================
   CARD
============================= */
.card{
  background:#fff;
  color:#000;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

/* =============================
   INPUTS
============================= */
input,select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:10px;
}

/* =============================
   STUDENT LIST
============================= */
.student{
  background:#f3f4f6;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  background:#1e40af;
  color:#fff;
  padding:4px 8px;
  border-radius:20px;
  font-size:12px;
}

.badge.exempt{
  background:#b91c1c;
}

.badge.discount{
  background:#15803d;
}

</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="logoSpin">HEDRA</div>
</div>

<!-- HEADER -->
<div class="header">
  <h1>HEDRA</h1>
  <div class="dateInfo" id="dateInfo"></div>
</div>

<div class="main">

  <!-- SETTINGS -->
  <div class="card">
    <h3>إعدادات الدورة</h3>

    <label>عدد الحصص</label>
    <select id="cycleLength">
      <option value="8" selected>8 حصص (افتراضي)</option>
      <option value="4">4 حصص</option>
      <option value="12">12 حصة</option>
    </select>

    <label>تاريخ أول حصة</label>
    <input type="date" id="startDate">

  </div>

  <!-- ADD STUDENT -->
  <div class="card">
    <h3>إضافة طالب</h3>

    <input type="text" id="studentName" placeholder="اسم الطالب">

    <label>السعر</label>
    <input type="number" id="studentPrice" value="200">

    <label>نوع الخصم</label>
    <select id="discountType">
      <option value="none">بدون</option>
      <option value="fixed">خصم مبلغ</option>
      <option value="percent">خصم نسبة</option>
      <option value="exempt">معفى</option>
    </select>

    <input type="number" id="discountValue" placeholder="قيمة الخصم">

    <button class="btn btn-primary" onclick="addStudent()">إضافة</button>
  </div>

  <!-- STUDENTS -->
  <div class="card">
    <h3>الطلاب</h3>
    <div id="studentsList"></div>
  </div>

</div>

<script>

/* =============================
   SPLASH TIMER
============================= */
setTimeout(()=>{
  document.getElementById("splash").style.display="none";
},2000);

/* =============================
   DATE HEADER
============================= */
function updateHeader(){
  const today=new Date();
  document.getElementById("dateInfo").innerText=
  today.toLocaleDateString("ar-EG",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}
updateHeader();

/* =============================
   DATA
============================= */
let students=[];

/* =============================
   ADD STUDENT
============================= */
function addStudent(){

  const name=document.getElementById("studentName").value.trim();
  const price=Number(document.getElementById("studentPrice").value);
  const type=document.getElementById("discountType").value;
  const value=Number(document.getElementById("discountValue").value);

  if(!name) return alert("ادخل اسم الطالب");

  students.push({
    name,price,type,value
  });

  document.getElementById("studentName").value="";
  renderStudents();
}

/* =============================
   CALCULATE FINAL PRICE
============================= */
function finalPrice(s){

  if(s.type==="exempt") return 0;

  if(s.type==="fixed")
    return Math.max(0,s.price-s.value);

  if(s.type==="percent")
    return Math.max(0,s.price-(s.price*s.value/100));

  return s.price;
}

/* =============================
   RENDER
============================= */
function renderStudents(){

  const list=document.getElementById("studentsList");
  list.innerHTML="";

  students.forEach(s=>{

    let badge="";
    if(s.type==="exempt")
      badge=`<span class="badge exempt">معفى</span>`;
    else if(s.type!=="none")
      badge=`<span class="badge discount">خصم</span>`;

    list.innerHTML+=`
      <div class="student">
        <div>
          <b>${s.name}</b>
          ${badge}
        </div>
        <div>
          ${finalPrice(s)} ج
        </div>
      </div>
    `;
  });

}

</script>

</body>
</html>
