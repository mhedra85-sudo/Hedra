<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hedra Clean</title>
<style>
body{font-family:tahoma;background:#f5f7fb;margin:0;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.05);margin-bottom:20px}
button{padding:8px 14px;border:none;border-radius:8px;background:#0A2A66;color:#fff;cursor:pointer}
input,select{padding:8px;border:1px solid #ccc;border-radius:8px;width:100%;margin:5px 0}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.small{font-size:13px}
</style>
</head>
<body>

<h2>Hedra – Clean Edition</h2>

<div class="card">
<h3>إضافة مجموعة</h3>
<input id="groupName" placeholder="اسم المجموعة">
<button onclick="addGroup()">إضافة</button>
</div>

<div class="card">
<h3>إضافة طالب</h3>
<select id="groupSelect"></select>
<input id="studentName" placeholder="اسم الطالب">
<input id="studentPrice" type="number" placeholder="سعر الحصة">
<button onclick="addStudent()">إضافة</button>
</div>

<div class="card">
<h3>الحضور والدفع</h3>
<div id="studentsList"></div>
</div>

<div class="card">
<h3>لوحة التحكم</h3>
<div id="dashboard"></div>
</div>

<div class="card">
<h3>النسخ الاحتياطي</h3>
<button onclick="exportData()">⬆ تصدير</button>
<button onclick="importData()">⬇ استيراد</button>
</div>

<script>
let db = {
  groups: []
};

function save(){
  localStorage.setItem("hedra_clean_db", JSON.stringify(db));
}

function load(){
  const raw = localStorage.getItem("hedra_clean_db");
  if(raw) db = JSON.parse(raw);
}

function addGroup(){
  const name = document.getElementById("groupName").value.trim();
  if(!name) return;
  db.groups.push({id:Date.now(), name, students:[]});
  document.getElementById("groupName").value="";
  save();
  render();
}

function addStudent(){
  const gid = Number(document.getElementById("groupSelect").value);
  const name = document.getElementById("studentName").value.trim();
  const price = Number(document.getElementById("studentPrice").value);
  if(!gid || !name) return;
  const g = db.groups.find(x=>x.id===gid);
  g.students.push({
    id:Date.now(),
    name,
    price,
    paid:0,
    attendance:0
  });
  document.getElementById("studentName").value="";
  document.getElementById("studentPrice").value="";
  save();
  render();
}

function markAttendance(gid,sid){
  const g = db.groups.find(x=>x.id===gid);
  const s = g.students.find(x=>x.id===sid);
  s.attendance++;
  save();
  render();
}

function addPayment(gid,sid){
  const amount = prompt("المبلغ:");
  if(!amount) return;
  const g = db.groups.find(x=>x.id===gid);
  const s = g.students.find(x=>x.id===sid);
  s.paid += Number(amount);
  save();
  render();
}

function render(){
  const sel = document.getElementById("groupSelect");
  sel.innerHTML="";
  db.groups.forEach(g=>{
    sel.innerHTML+=`<option value="${g.id}">${g.name}</option>`;
  });

  const list = document.getElementById("studentsList");
  list.innerHTML="";
  db.groups.forEach(g=>{
    g.students.forEach(s=>{
      list.innerHTML+=`
      <div class="row">
        <div>
          <b>${s.name}</b>
          <div class="small">
            حضور: ${s.attendance} |
            مدفوع: ${s.paid} |
            مستحق: ${(s.attendance*s.price)-s.paid}
          </div>
        </div>
        <div>
          <button onclick="markAttendance(${g.id},${s.id})">حضور</button>
          <button onclick="addPayment(${g.id},${s.id})">دفع</button>
        </div>
      </div>`;
    });
  });

  renderDashboard();
}

function renderDashboard(){
  let total=0, debt=0;
  db.groups.forEach(g=>{
    g.students.forEach(s=>{
      total+=s.paid;
      debt+=(s.attendance*s.price)-s.paid;
    });
  });
  document.getElementById("dashboard").innerHTML=`
    إجمالي المحصل: ${total} <br>
    إجمالي المتبقي: ${debt}
  `;
}

function exportData(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hedra_backup.json";
  a.click();
}

function importData(){
  const inp = document.createElement("input");
  inp.type="file";
  inp.accept="application/json";
  inp.onchange = e=>{
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ()=>{
      db = JSON.parse(reader.result);
      save();
      render();
    };
    reader.readAsText(file);
  };
  inp.click();
}

load();
render();
</script>

</body>
</html>
