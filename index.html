<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>برنامج إدارة الطلاب والحضور والدفعات</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Cairo', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #0a2a66 70%, #e0e7ef 100%);
      color: #222;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      max-width: 750px;
      margin: 40px auto;
      background: rgba(255,255,255,0.98);
      box-shadow: 0 12px 48px rgba(10,42,102,0.13);
      border-radius: 32px;
      padding: 32px 18px 40px 18px;
      text-align: right;
    }
    h1 {
      text-align: center;
      color: #0a2a66;
      margin-bottom: 32px;
      font-weight: bold;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .actions button {
      background: linear-gradient(90deg,#0a2a66 60%,#3b82f6 100%);
      color: #fff;
      border: none;
      padding: 10px 28px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 16px #e0e7ef60;
      cursor: pointer;
      transition: background 0.2s;
    }
    .actions button:active {background: #003585;}
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
    }
    th, td {
      padding: 10px;
      text-align: right;
    }
    th {
      background: #e3ebf8;
      color: #0a2a66;
      font-weight: bold;
      font-size: 15px;
    }
    tr:nth-child(even) { background: #f3f7fb; }
    .btn-small {
      padding: 5px 10px;
      font-size: 13px;
      margin-left: 2px;
      border-radius: 10px;
      background: #dbeafe;
      color: #0a2a66;
      border: none;
      cursor: pointer;
      transition: background 0.18s;
    }
    .btn-small:active { background: #60a5fa; color: #fff; }
    .summary {
      background: #f1f5fb;
      border-radius: 16px;
      padding: 18px 18px 10px 18px;
      margin: 32px 0 0 0;
      font-size: 16px;
      color: #23376b;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      border: 1px solid #b6c2dd;
      border-radius: 10px;
      font-size: 16px;
      background: #f5f7fa;
    }
    .modal {
      position: fixed; inset: 0;
      background: rgba(2,6,23,0.22);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal-box {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 12px 32px #2223;
      padding: 28px 22px 20px 22px;
      min-width: 280px; max-width: 94vw;
      min-height: 0;
    }
    .modal label { font-weight: bold; }
    .modal .actions {justify-content: flex-end;}
    .close-btn {
      background: #f3f4f6; color: #0a2a66;
      border: none; border-radius: 10px;
      padding: 7px 14px;
      margin-right: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .close-btn:active { background: #d1d5db; }
    @media (max-width: 600px) {
      .container {padding: 12px 4px;}
      table th, table td { font-size: 13px; padding: 6px; }
      .actions button { font-size: 13px; padding: 8px 8px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧮 برنامج إدارة الطلاب والحضور والدفعات</h1>
    <div class="actions">
      <button onclick="openStudentModal()">+ إضافة طالب</button>
      <button onclick="exportCSV()">تصدير بيانات Excel</button>
    </div>
    <table id="studentsTable">
      <thead>
        <tr>
          <th>#</th>
          <th>اسم الطالب</th>
          <th>الجوال</th>
          <th>سعر الدورة</th>
          <th>المدفوع</th>
          <th>المتبقي</th>
          <th>الحضور</th>
          <th>الغياب</th>
          <th>إجراءات</th>
        </tr>
      </thead>
      <tbody>
        <!-- سيتم تعبئتها تلقائيًا -->
      </tbody>
    </table>
    <div class="summary" id="summary"></div>
  </div>

  <!-- نافذة إضافة/تعديل طالب -->
  <div class="modal" id="studentModal" style="display:none" onclick="if(event.target==this)closeStudentModal()">
    <div class="modal-box">
      <h2 style="color:#0a2a66;margin-top:0;margin-bottom:18px" id="modalTitle">إضافة طالب</h2>
      <label>اسم الطالب</label>
      <input type="text" id="inputName">
      <label>رقم الجوال</label>
      <input type="text" id="inputPhone">
      <label>سعر الدورة</label>
      <input type="number" id="inputPrice" min="0">
      <div class="actions" style="margin-top:14px">
        <button class="close-btn" onclick="closeStudentModal()">إلغاء</button>
        <button onclick="saveStudent()" style="background:linear-gradient(90deg,#0a2a66,#3b82f6);color:#fff;">حفظ</button>
      </div>
    </div>
  </div>

  <script>
    // البيانات محفوظة في localStorage
    let students = JSON.parse(localStorage.getItem('hedra_students') || "[]");
    let editIdx = null;

    function saveData() {
      localStorage.setItem('hedra_students', JSON.stringify(students));
      render();
    }

    function render() {
      const tbody = document.querySelector("#studentsTable tbody");
      tbody.innerHTML = "";
      if (students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:#888">لا يوجد طلاب بعد. اضغط على "إضافة طالب".</td></tr>`;
      } else {
        students.forEach((s, i) => {
          tbody.innerHTML += `
            <tr>
              <td>${i + 1}</td>
              <td>${s.name}</td>
              <td>${s.phone}</td>
              <td>${s.price}</td>
              <td style="color:green">${s.paid}</td>
              <td style="color:#b91c1c">${s.price - s.paid}</td>
              <td>${s.attend}</td>
              <td>${s.absent}</td>
              <td>
                <button class="btn-small" onclick="openStudentModal(${i})">✏️</button>
                <button class="btn-small" onclick="addPayment(${i})">💵</button>
                <button class="btn-small" onclick="markAttendance(${i},'P')">✅</button>
                <button class="btn-small" onclick="markAttendance(${i},'A')">❌</button>
                <button class="btn-small" onclick="deleteStudent(${i})">🗑</button>
              </td>
            </tr>
          `;
        });
      }
      updateSummary();
    }

    function openStudentModal(idx = null) {
      editIdx = idx;
      document.getElementById('studentModal').style.display = 'flex';
      document.getElementById('modalTitle').innerText = idx === null ? 'إضافة طالب' : 'تعديل بيانات الطالب';
      document.getElementById('inputName').value = idx === null ? '' : students[idx].name;
      document.getElementById('inputPhone').value = idx === null ? '' : students[idx].phone;
      document.getElementById('inputPrice').value = idx === null ? '' : students[idx].price;
    }

    function closeStudentModal() {
      document.getElementById('studentModal').style.display = 'none';
      editIdx = null;
    }

    function saveStudent() {
      const name = document.getElementById('inputName').value.trim();
      const phone = document.getElementById('inputPhone').value.trim();
      const price = Number(document.getElementById('inputPrice').value);
      if (!name) return alert('يجب إدخال اسم الطالب');
      if (!(price > 0)) return alert('أدخل سعر الدورة');
      if (editIdx === null) {
        students.push({ name, phone, price, paid: 0, attend: 0, absent: 0 });
      } else {
        students[editIdx].name = name;
        students[editIdx].phone = phone;
        students[editIdx].price = price;
      }
      saveData();
      closeStudentModal();
    }

    function deleteStudent(idx) {
      if (!confirm("هل تريد حذف الطالب؟")) return;
      students.splice(idx, 1);
      saveData();
    }

    function addPayment(idx) {
      let amt = prompt("أدخل مبلغ الدفعة", "0");
      amt = Number(amt);
      if (!(amt > 0)) return;
      students[idx].paid += amt;
      saveData();
    }

    function markAttendance(idx, type) {
      if (type === 'P') students[idx].attend += 1;
      else students[idx].absent += 1;
      saveData();
    }

    function exportCSV() {
      let csv = "اسم الطالب,الجوال,سعر الدورة,المدفوع,المتبقي,الحضور,الغياب\n";
      students.forEach(s => {
        csv += `${s.name},${s.phone},${s.price},${s.paid},${s.price - s.paid},${s.attend},${s.absent}\n`;
      });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "students.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function updateSummary() {
      let total = students.reduce((a, s) => a + (s.price || 0), 0);
      let paid = students.reduce((a, s) => a + (s.paid || 0), 0);
      let remain = total - paid;
      let attend = students.reduce((a, s) => a + (s.attend || 0), 0);
      let absent = students.reduce((a, s) => a + (s.absent || 0), 0);
      document.getElementById('summary').innerHTML =
        `<b>عدد الطلاب:</b> ${students.length} &nbsp; | &nbsp; <b>الإجمالي:</b> ${total} &nbsp; | &nbsp; <b>المدفوع:</b> ${paid} &nbsp; | &nbsp; <b>المتبقي:</b> <span style="color:#b91c1c">${remain}</span> &nbsp; | &nbsp; <b>الحضور:</b> ${attend} &nbsp; | &nbsp; <b>الغياب:</b> ${absent}`;
    }

    // أول تحميل
    render();
  </script>
</body>
</html>
